# Cloud Build configuration for the Hushh.ai website frontend.
# Builds a standalone Next.js image and deploys it to Cloud Run.

steps:
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    id: "build-frontend-image"
    args:
      - "-c"
      - |
        set -euo pipefail

        required_vars=(
          NEXT_PUBLIC_SITE_URL_VAL
          NEXT_PUBLIC_HUSHH_API_BASE_URL_VAL
          NEXT_PUBLIC_HUSHH_API_ANON_KEY_VAL
          NEXT_PUBLIC_FIREBASE_API_KEY_VAL
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN_VAL
          NEXT_PUBLIC_FIREBASE_PROJECT_ID_VAL
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET_VAL
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID_VAL
          NEXT_PUBLIC_FIREBASE_APP_ID_VAL
          NEXT_PUBLIC_FIREBASE_VAPID_KEY_VAL
          NEXT_PUBLIC_SUPABASE_URL_VAL
          NEXT_PUBLIC_SUPABASE_ANON_KEY_VAL
          NEXT_PUBLIC_DEVELOPER_APP_URL_VAL
          NEXT_PUBLIC_DEVELOPER_API_URL_VAL
          NEXT_PUBLIC_DEVELOPER_MCP_URL_VAL
          NEXT_PUBLIC_BACKEND_URL_VAL
        )

        for name in "${required_vars[@]}"; do
          if [ -z "${!name}" ]; then
            echo "Missing required website build config: ${name}"
            exit 1
          fi
        done

        docker build \
          -t "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_FRONTEND_SERVICE}:manual" \
          -t "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_FRONTEND_SERVICE}:latest" \
          -t "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_FRONTEND_SERVICE}:${_IMAGE_TAG}" \
          --build-arg NEXT_PUBLIC_SITE_URL=$$NEXT_PUBLIC_SITE_URL_VAL \
          --build-arg NEXT_PUBLIC_HUSHH_API_BASE_URL=$$NEXT_PUBLIC_HUSHH_API_BASE_URL_VAL \
          --build-arg NEXT_PUBLIC_HUSHH_API_ANON_KEY=$$NEXT_PUBLIC_HUSHH_API_ANON_KEY_VAL \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=$$NEXT_PUBLIC_FIREBASE_API_KEY_VAL \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN_VAL \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=$$NEXT_PUBLIC_FIREBASE_PROJECT_ID_VAL \
          --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$$NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET_VAL \
          --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$$NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID_VAL \
          --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=$$NEXT_PUBLIC_FIREBASE_APP_ID_VAL \
          --build-arg NEXT_PUBLIC_FIREBASE_VAPID_KEY=$$NEXT_PUBLIC_FIREBASE_VAPID_KEY_VAL \
          --build-arg NEXT_PUBLIC_SUPABASE_URL=$$NEXT_PUBLIC_SUPABASE_URL_VAL \
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=$$NEXT_PUBLIC_SUPABASE_ANON_KEY_VAL \
          --build-arg NEXT_PUBLIC_DEVELOPER_APP_URL=$$NEXT_PUBLIC_DEVELOPER_APP_URL_VAL \
          --build-arg NEXT_PUBLIC_DEVELOPER_API_URL=$$NEXT_PUBLIC_DEVELOPER_API_URL_VAL \
          --build-arg NEXT_PUBLIC_DEVELOPER_MCP_URL=$$NEXT_PUBLIC_DEVELOPER_MCP_URL_VAL \
          --build-arg NEXT_PUBLIC_BACKEND_URL=$$NEXT_PUBLIC_BACKEND_URL_VAL \
          -f Dockerfile \
          .
    secretEnv:
      - NEXT_PUBLIC_SITE_URL_VAL
      - NEXT_PUBLIC_HUSHH_API_BASE_URL_VAL
      - NEXT_PUBLIC_HUSHH_API_ANON_KEY_VAL
      - NEXT_PUBLIC_FIREBASE_API_KEY_VAL
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN_VAL
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID_VAL
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET_VAL
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID_VAL
      - NEXT_PUBLIC_FIREBASE_APP_ID_VAL
      - NEXT_PUBLIC_FIREBASE_VAPID_KEY_VAL
      - NEXT_PUBLIC_SUPABASE_URL_VAL
      - NEXT_PUBLIC_SUPABASE_ANON_KEY_VAL
      - NEXT_PUBLIC_DEVELOPER_APP_URL_VAL
      - NEXT_PUBLIC_DEVELOPER_API_URL_VAL
      - NEXT_PUBLIC_DEVELOPER_MCP_URL_VAL
      - NEXT_PUBLIC_BACKEND_URL_VAL

  - name: "gcr.io/cloud-builders/docker"
    id: "push-frontend-manual"
    args:
      - push
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_FRONTEND_SERVICE}:manual"

  - name: "gcr.io/cloud-builders/docker"
    id: "push-frontend-latest"
    args:
      - push
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_FRONTEND_SERVICE}:latest"

  - name: "gcr.io/cloud-builders/docker"
    id: "push-frontend-version"
    args:
      - push
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_FRONTEND_SERVICE}:${_IMAGE_TAG}"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-frontend"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_FRONTEND_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_FRONTEND_SERVICE}:${_IMAGE_TAG}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=8080"
      - "--memory=1Gi"
      - "--cpu=1"
      - "--timeout=120"
      - "--max-instances=10"
      - "--min-instances=0"
      - "--execution-environment=gen2"
      - "--service-account=website-runtime@$PROJECT_ID.iam.gserviceaccount.com"
      - "--set-env-vars=NODE_ENV=production,NEXT_PUBLIC_APP_ENV=${_APP_ENV}"
      - "--set-secrets=NEXT_PUBLIC_SITE_URL=NEXT_PUBLIC_SITE_URL:latest,NEXT_PUBLIC_HUSHH_API_BASE_URL=NEXT_PUBLIC_HUSHH_API_BASE_URL:latest,NEXT_PUBLIC_HUSHH_API_ANON_KEY=NEXT_PUBLIC_HUSHH_API_ANON_KEY:latest,NEXT_PUBLIC_FIREBASE_API_KEY=NEXT_PUBLIC_FIREBASE_API_KEY:latest,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:latest,NEXT_PUBLIC_FIREBASE_PROJECT_ID=NEXT_PUBLIC_FIREBASE_PROJECT_ID:latest,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:latest,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:latest,NEXT_PUBLIC_FIREBASE_APP_ID=NEXT_PUBLIC_FIREBASE_APP_ID:latest,NEXT_PUBLIC_FIREBASE_VAPID_KEY=NEXT_PUBLIC_FIREBASE_VAPID_KEY:latest,NEXT_PUBLIC_SUPABASE_URL=NEXT_PUBLIC_SUPABASE_URL:latest,NEXT_PUBLIC_SUPABASE_ANON_KEY=NEXT_PUBLIC_SUPABASE_ANON_KEY:latest,NEXT_PUBLIC_DEVELOPER_APP_URL=NEXT_PUBLIC_DEVELOPER_APP_URL:latest,NEXT_PUBLIC_DEVELOPER_API_URL=NEXT_PUBLIC_DEVELOPER_API_URL:latest,NEXT_PUBLIC_DEVELOPER_MCP_URL=NEXT_PUBLIC_DEVELOPER_MCP_URL:latest,NEXT_PUBLIC_BACKEND_URL=NEXT_PUBLIC_BACKEND_URL:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,HUSHH_API_BASE_URL=HUSHH_API_BASE_URL:latest,FIREBASE_SERVICE_ACCOUNT_JSON=FIREBASE_SERVICE_ACCOUNT_JSON:latest,FIREBASE_AUTH_SERVICE_ACCOUNT_JSON=FIREBASE_AUTH_SERVICE_ACCOUNT_JSON:latest,HUSHH_INTELLIGENCE_BACKEND_URL=HUSHH_INTELLIGENCE_BACKEND_URL:latest,HUSHH_INTELLIGENCE_API_KEY=HUSHH_INTELLIGENCE_API_KEY:latest"

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_FRONTEND_SERVICE}:manual"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_FRONTEND_SERVICE}:latest"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_FRONTEND_SERVICE}:${_IMAGE_TAG}"

timeout: "1800s"

substitutions:
  _FRONTEND_SERVICE: hushh-ai-website
  _REGION: us-central1
  _APP_ENV: production
  _AR_REPOSITORY: website-images
  _IMAGE_TAG: manual

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_SITE_URL/versions/latest
      env: NEXT_PUBLIC_SITE_URL_VAL
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_HUSHH_API_BASE_URL/versions/latest
      env: NEXT_PUBLIC_HUSHH_API_BASE_URL_VAL
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_HUSHH_API_ANON_KEY/versions/latest
      env: NEXT_PUBLIC_HUSHH_API_ANON_KEY_VAL
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_API_KEY/versions/latest
      env: NEXT_PUBLIC_FIREBASE_API_KEY_VAL
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN/versions/latest
      env: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN_VAL
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_PROJECT_ID/versions/latest
      env: NEXT_PUBLIC_FIREBASE_PROJECT_ID_VAL
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET/versions/latest
      env: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET_VAL
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID/versions/latest
      env: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID_VAL
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_APP_ID/versions/latest
      env: NEXT_PUBLIC_FIREBASE_APP_ID_VAL
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_FIREBASE_VAPID_KEY/versions/latest
      env: NEXT_PUBLIC_FIREBASE_VAPID_KEY_VAL
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_SUPABASE_URL/versions/latest
      env: NEXT_PUBLIC_SUPABASE_URL_VAL
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_SUPABASE_ANON_KEY/versions/latest
      env: NEXT_PUBLIC_SUPABASE_ANON_KEY_VAL
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_DEVELOPER_APP_URL/versions/latest
      env: NEXT_PUBLIC_DEVELOPER_APP_URL_VAL
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_DEVELOPER_API_URL/versions/latest
      env: NEXT_PUBLIC_DEVELOPER_API_URL_VAL
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_DEVELOPER_MCP_URL/versions/latest
      env: NEXT_PUBLIC_DEVELOPER_MCP_URL_VAL
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_BACKEND_URL/versions/latest
      env: NEXT_PUBLIC_BACKEND_URL_VAL

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
