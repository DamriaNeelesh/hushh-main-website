name: Deploy website
description: Shared Cloud Build / Cloud Run deployment action for Hushh website environments

inputs:
  gcp_project_id:
    required: true
  gcp_region:
    required: true
  frontend_service:
    required: true
  artifact_repository:
    required: true
  cloud_run_revision_retention:
    required: true
  public_base_url:
    required: true
  app_env:
    required: true
  deploy_sha:
    required: true
  main_branch:
    required: false
    default: main
  gcp_credentials_json:
    required: true
  rollout_domains:
    required: true
  apex_base_url:
    required: false
    default: ""

outputs:
  frontend_url:
    description: Cloud Run frontend URL
    value: ${{ steps.runtime-info.outputs.url }}
  deploy_sha:
    description: Deployed commit SHA
    value: ${{ steps.resolve-deploy-sha.outputs.deploy_sha }}
  image_tag:
    description: Deployed image tag
    value: ${{ steps.resolve-deploy-sha.outputs.image_tag }}
  revision_name:
    description: Latest ready Cloud Run revision
    value: ${{ steps.runtime-info.outputs.revision_name }}

runs:
  using: composite
  steps:
    - name: Assert deploy SHA belongs to main history
      shell: bash
      run: bash scripts/ci/require-ref-on-main.sh "${{ inputs.main_branch }}" "${{ inputs.deploy_sha }}"

    - name: Resolve deploy SHA
      id: resolve-deploy-sha
      shell: bash
      run: |
        set -euo pipefail
        DEPLOY_SHA="$(git rev-parse HEAD)"
        echo "deploy_sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
        echo "image_tag=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ inputs.gcp_credentials_json }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
      with:
        install_components: beta

    - name: Set GCP project context
      shell: bash
      run: gcloud config set project "${{ inputs.gcp_project_id }}"

    - name: Assert GCP project scope
      shell: bash
      run: |
        set -euo pipefail
        ACTIVE_PROJECT="$(gcloud config get-value project 2>/dev/null)"
        if [ "$ACTIVE_PROJECT" != "${{ inputs.gcp_project_id }}" ]; then
          echo "Refusing deploy: expected project '${{ inputs.gcp_project_id }}' but got '$ACTIVE_PROJECT'."
          exit 1
        fi

    - name: Deploy website using Cloud Build
      shell: bash
      run: |
        set -euo pipefail
        gcloud builds submit \
          --project="${{ inputs.gcp_project_id }}" \
          --config=deploy/frontend.cloudbuild.yaml \
          "--substitutions=_FRONTEND_SERVICE=${{ inputs.frontend_service }},_REGION=${{ inputs.gcp_region }},_APP_ENV=${{ inputs.app_env }},_AR_REPOSITORY=${{ inputs.artifact_repository }},_IMAGE_TAG=${{ steps.resolve-deploy-sha.outputs.image_tag }}"

    - name: Get frontend URL and revision
      id: runtime-info
      shell: bash
      run: |
        FRONTEND_URL="$(gcloud run services describe "${{ inputs.frontend_service }}" \
          --project="${{ inputs.gcp_project_id }}" \
          --region="${{ inputs.gcp_region }}" \
          --format='value(status.url)')"
        REVISION_NAME="$(gcloud run services describe "${{ inputs.frontend_service }}" \
          --project="${{ inputs.gcp_project_id }}" \
          --region="${{ inputs.gcp_region }}" \
          --format='value(status.latestReadyRevisionName)')"
        echo "url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"
        echo "revision_name=$REVISION_NAME" >> "$GITHUB_OUTPUT"
        echo "Frontend URL: $FRONTEND_URL"
        echo "Latest ready revision: $REVISION_NAME"

    - name: Retain latest frontend revisions
      continue-on-error: true
      shell: bash
      run: bash scripts/ci/cloudrun-retention.sh "${{ inputs.frontend_service }}" "${{ inputs.gcp_region }}" "${{ inputs.cloud_run_revision_retention }}"

    - name: Verify website runtime env parity
      shell: bash
      run: |
        python3 scripts/ops/verify-website-env-secrets-parity.py \
          --project "${{ inputs.gcp_project_id }}" \
          --region "${{ inputs.gcp_region }}" \
          --frontend-service "${{ inputs.frontend_service }}" \
          --assert-runtime-env-contract

    - name: Verify deployed image and public domain readiness
      shell: bash
      run: |
        set -euo pipefail
        declare -a domain_flags=()
        IFS=',' read -ra domains <<< "${{ inputs.rollout_domains }}"
        for domain in "${domains[@]}"; do
          domain="$(printf '%s' "$domain" | xargs)"
          if [ -n "$domain" ]; then
            domain_flags+=("--domain" "$domain")
          fi
        done

        python3 scripts/ops/verify-website-rollout.py \
          --project "${{ inputs.gcp_project_id }}" \
          --region "${{ inputs.gcp_region }}" \
          --service "${{ inputs.frontend_service }}" \
          --expected-image-tag "${{ steps.resolve-deploy-sha.outputs.image_tag }}" \
          "${domain_flags[@]}"

    - name: Smoke deployed Cloud Run routes
      shell: bash
      env:
        BASE_URL: ${{ steps.runtime-info.outputs.url }}
      run: bash scripts/ops/smoke-website-routes.sh

    - name: Smoke deployed public routes
      shell: bash
      env:
        BASE_URL: ${{ inputs.public_base_url }}
      run: bash scripts/ops/smoke-website-routes.sh

    - name: Verify apex redirect to www
      if: ${{ inputs.apex_base_url != '' }}
      shell: bash
      run: |
        set -euo pipefail
        headers="$(curl -sSI "${{ inputs.apex_base_url }}")"
        status="$(printf '%s' "$headers" | awk 'toupper($1) ~ /^HTTP/ {print $2; exit}')"
        location="$(printf '%s' "$headers" | awk 'tolower($1) == "location:" {print $2}' | tr -d '\r' | head -n1)"
        if [ "$status" != "308" ]; then
          echo "Expected apex redirect status 308, got ${status}."
          exit 1
        fi
        if [ "$location" != "${{ inputs.public_base_url }}" ]; then
          echo "Expected apex redirect to ${{ inputs.public_base_url }}, got ${location}."
          exit 1
        fi
        echo "Verified apex redirect: ${status} ${location}"
