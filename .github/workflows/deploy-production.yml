name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Full 40-character commit SHA from main to deploy to production
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: hushh-ai-prod
  GCP_REGION: us-central1
  FRONTEND_SERVICE: hushh-ai-website
  ARTIFACT_REPOSITORY: website-images
  CLOUD_RUN_REVISION_RETENTION: "10"
  PUBLIC_BASE_URL: https://www.hushh.ai
  APEX_BASE_URL: https://hushh.ai

jobs:
  deploy:
    name: Production Deploy
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.deploy_sha }}

      - name: Deploy website
        id: deploy-website
        uses: ./.github/actions/deploy-website
        with:
          gcp_project_id: ${{ env.GCP_PROJECT_ID }}
          gcp_region: ${{ env.GCP_REGION }}
          frontend_service: ${{ env.FRONTEND_SERVICE }}
          artifact_repository: ${{ env.ARTIFACT_REPOSITORY }}
          cloud_run_revision_retention: ${{ env.CLOUD_RUN_REVISION_RETENTION }}
          public_base_url: ${{ env.PUBLIC_BASE_URL }}
          app_env: production
          deploy_sha: ${{ inputs.deploy_sha }}
          main_branch: main
          gcp_credentials_json: ${{ secrets.GCP_SA_KEY_PROD }}
          rollout_domains: hushh.ai,www.hushh.ai
          apex_base_url: ${{ env.APEX_BASE_URL }}

      - name: Deployment Summary
        if: always()
        run: |
          echo "Production website deployment complete"
          echo "Deploy SHA: ${{ steps.deploy-website.outputs.deploy_sha }}"
          echo "Image tag: ${{ steps.deploy-website.outputs.image_tag }}"
          echo "Revision: ${{ steps.deploy-website.outputs.revision_name }}"
          echo "Frontend: ${{ steps.deploy-website.outputs.frontend_url }}"
          echo "Public URL: ${{ env.PUBLIC_BASE_URL }}"
