# .github/workflows/cicd.yml
name: cicd-workflow

on:
  push:
    branches: [main, deploy_uat, deploy]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited, closed]

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.28.0"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        run: gitleaks detect --source . --no-git --redact --config .gitleaks.toml

  build:
    name: Website CI
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run website release gate
        run: bash scripts/ci/orchestrate.sh all

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: website-ci-artifacts
          path: .artifacts/ci

  ci-status:
    name: CI Status Gate
    needs:
      - secret-scan
      - build
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Validate job outcomes
        shell: bash
        run: |
          SECRET_SCAN="${{ needs['secret-scan'].result }}"
          BUILD="${{ needs.build.result }}"

          printf 'secret-scan=%s\n' "$SECRET_SCAN"
          printf 'build=%s\n' "$BUILD"

          fail=0
          for result in "$SECRET_SCAN" "$BUILD"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ] || [ "$result" = "timed_out" ]; then
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "One or more CI jobs failed."
            exit 1
          fi

          echo "All required CI jobs passed or were intentionally skipped."
