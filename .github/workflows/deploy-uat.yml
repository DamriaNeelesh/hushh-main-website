name: Deploy Website to UAT

on:
  push:
    branches:
      - deploy_uat
  workflow_dispatch:

concurrency:
  group: deploy-uat-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: hushh-ai-uat
  GCP_REGION: us-central1
  FRONTEND_SERVICE: hushh-ai-website
  ARTIFACT_REPOSITORY: website-images
  CLOUD_RUN_REVISION_RETENTION: "10"
  PUBLIC_BASE_URL: https://uat.hushh.ai

jobs:
  deploy:
    name: Deploy UAT Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Deploy website
        id: deploy-website
        uses: ./.github/actions/deploy-website
        with:
          gcp_project_id: ${{ env.GCP_PROJECT_ID }}
          gcp_region: ${{ env.GCP_REGION }}
          frontend_service: ${{ env.FRONTEND_SERVICE }}
          artifact_repository: ${{ env.ARTIFACT_REPOSITORY }}
          cloud_run_revision_retention: ${{ env.CLOUD_RUN_REVISION_RETENTION }}
          public_base_url: ${{ env.PUBLIC_BASE_URL }}
          app_env: uat
          required_branch: deploy_uat
          gcp_credentials_json: ${{ secrets.GCP_SA_KEY_UAT }}
          rollout_domains: uat.hushh.ai

      - name: Deployment Summary
        if: always()
        run: |
          echo "UAT website deployment complete"
          echo "Frontend: ${{ steps.deploy-website.outputs.frontend_url }}"
          echo "Public URL: ${{ env.PUBLIC_BASE_URL }}"
